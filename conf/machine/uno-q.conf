# Arduino UNO Q base machine (Qualcomm QRB2210 / QCM2290).
#
# imola.conf (meta-arduino-qcom) does `require conf/machine/uno-q.conf`, but the
# file is not shipped by meta-arduino-qcom or meta-qcom. We provide it here (it
# is found via BBPATH) modeled on meta-qcom's QRB2210 rb1-core-kit so the imola
# machine resolves. This ideally belongs upstream in meta-arduino-qcom; move it
# there once Arduino ships it.

require conf/machine/include/qcom-qcm2290.inc

MACHINE_FEATURES = "efi usbhost usbgadget alsa wifi bluetooth"

PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot"
UBOOT_CONFIG = "qrb2210-rb1"

QCOM_DTB_DEFAULT ?= "qrb2210-rb1"
KERNEL_DEVICETREE ?= " qcom/qrb2210-rb1.dtb "

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    packagegroup-rb1-firmware \
    packagegroup-rb1-hexagon-dsp-binaries \
    qbootctl \
"

QCOM_BOOT_FILES_SUBDIR = "qrb2210"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/qrb2210-rb1/emmc"
QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-qrb2210-rb1"
